name: server-ci

on:
  push:
    paths:
      - "roomclimate/server/**"
      - "Docs/api/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "roomclimate/server/**"
      - "Docs/api/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roomclimate/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Та же версия, что в Dockerfile: на системном Python раннера (новее) у закреплённого
      # pydantic нет готовых колёс, и pip падает при сборке pydantic-core из исходников.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for unit tests
        run: python3 -m pip install -r requirements.txt httpx pyyaml

      # Спецификации UT-01…UT-19 из Docs/testing.md (лабораторные № 5–6), фреймворк unittest.
      - name: Unit tests (lab specs UT-01…UT-19)
        run: python3 -m unittest -v test_lab_specs

      # Сервер соответствует контракту Docs/api/openapi.yaml (лабораторная № 7).
      - name: Contract test (OpenAPI)
        run: python3 -m unittest -v test_contract

      - name: Unit tests (insights)
        run: python3 test_insights.py

      - name: Unit tests (alerts)
        run: python3 test_alerts.py

      - name: Unit tests (password recovery)
        run: python3 test_recovery.py

      - name: Unit tests (app update)
        run: python3 test_app_update.py

      - name: Unit tests (my home)
        run: python3 test_home.py

      - name: Unit tests (board)
        run: python3 test_board.py

      - name: Unit tests (registry and migrations)
        run: python3 test_registry.py

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Smoke test
        run: python3 smoke_test.py http://127.0.0.1:8000

      - name: Stop stack
        if: always()
        run: docker compose down
