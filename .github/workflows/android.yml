name: android-ci

on:
  push:
    paths:
      - "roomclimate/android/**"
      - "roomclimate/server/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "roomclimate/android/**"
      - "roomclimate/server/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roomclimate/android/RoomClimateApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      # Интеграционные тесты (LiveServerIntegrationTest) ходят в настоящий сервер.
      - name: Start server stack
        working-directory: roomclimate/server
        run: docker compose up --build -d api redis worker

      - name: Wait for server
        run: |
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 3
          done
          exit 1

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: roomclimate/android/RoomClimateApp/app/build/reports/tests

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomClimate-debug-apk
          path: roomclimate/android/RoomClimateApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Stop server stack
        if: always()
        working-directory: roomclimate/server
        run: docker compose down
