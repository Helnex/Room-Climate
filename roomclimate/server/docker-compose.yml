x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  SQLITE_PATH: /data/roomclimate.db
  CURRENT_TTL_SECONDS: "60"
  # Секрет платы. scripts/start.ps1 сам создаёт server/.env с INGEST_TOKEN — тогда чужие
  # устройства в Wi-Fi не смогут присылать поддельные показания. Пусто = приём от всех.
  INGEST_TOKEN: ${INGEST_TOKEN:-}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  # Через сколько секунд без показаний датчик считается «молчащим».
  STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
  # Тревога, только если выход за порог держится дольше этого времени (защита от дребезга).
  ALERT_DELAY_SECONDS: ${ALERT_DELAY_SECONDS:-60}
  # Push-уведомления через ntfy (сервис ниже). Тема — секретная строка из server/.env.
  NTFY_URL: http://ntfy:80
  NTFY_TOPIC: ${NTFY_TOPIC:-}
  NTFY_PUBLIC_PORT: "8090"
  TLS_PUBLIC_PORT: "8443"
  CERT_DIR: /certs
  # Почта для кодов восстановления пароля (необязательно, см. .env.example).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app-env
    volumes:
      - sqlite_data:/data
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'\"ok\"' in urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # То же API по HTTPS с самоподписанным сертификатом. Приложение принимает только этот
  # ключ (pin передаётся через QR-код страницы /connect) — трафик в Wi-Fi шифруется.
  api-tls:
    build: .
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment: *app-env
    # Одной строкой: в многострочной YAML-записи переводы строк рвали команду,
    # и uvicorn запускался без --ssl-* (обычный HTTP на 8443).
    command: ["sh", "-c", "python -m app.tls_cert && exec uvicorn app.main:app --host 0.0.0.0 --port 8443 --ssl-keyfile /certs/key.pem --ssl-certfile /certs/cert.pem"]
    volumes:
      - sqlite_data:/data
      - certs:/certs
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    environment: *app-env
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # Сервер push-уведомлений (без Google/Firebase). На телефоне — приложение ntfy,
  # подписка на http://IP_компьютера:8090/<NTFY_TOPIC> (ссылку даёт /notify/info).
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: serve
    ports:
      - "8090:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
    environment:
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h

  # Доступ из интернета: временный туннель Cloudflare (адрес *.trycloudflare.com, без домена
  # и без аккаунта; меняется при перезапуске — start.ps1 показывает новый и кладёт в QR).
  # Включается профилем: docker compose --profile tunnel up -d  (или start.ps1 -Tunnel).
  # Наружу открыт только HTTP API (сервис api); ntfy и порт платы остаются в локальной сети.
  cloudflared:
    image: cloudflare/cloudflared:2024.11.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://api:8000"]
    # Свой DNS: VPN-клиенты на компьютере (FlClash/Clash) подменяют адреса Cloudflare на
    # «фейковые» 198.18.x.x, и соединение туннеля рвётся (ошибка 1033 / TLS EOF).
    dns: ["1.1.1.1", "1.0.0.1"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
  certs:
  ntfy_cache:
