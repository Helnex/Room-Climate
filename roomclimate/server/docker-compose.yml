services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /data/roomclimate.db
      CURRENT_TTL_SECONDS: "60"
      # Секрет платы. Задайте в server/.env (INGEST_TOKEN=...) — тогда чужие устройства
      # в Wi-Fi не смогут присылать поддельные показания.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Через сколько секунд без показаний датчик считается «молчащим» (/devices, /telemetry/insights).
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'\"ok\"' in urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /data/roomclimate.db
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  sqlite_data:
